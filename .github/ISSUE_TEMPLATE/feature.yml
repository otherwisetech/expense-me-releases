name: Pedir una función / Request a feature
description: Una idea para que expense me te sirva más. / An idea to make expense me more useful.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Este issue es público.** No incluyas datos personales ni financieros reales. / **This issue is public.** Don't include personal or real financial data.
  - type: textarea
    id: goal
    attributes:
      label: Qué quieres lograr / What you want to achieve
      description: Cuéntanos el problema, no la solución. / Tell us the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Cómo lo haces hoy / How you do it today
  - type: dropdown
    id: importance
    attributes:
      label: Qué tan importante es para ti / How important is it to you
      options:
        - Me ayudaría / Nice to have
        - Lo necesito seguido / I need it often
        - Sin esto no puedo usar expense me / I can't use expense me without it
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad / Privacy
      options:
        - label: Revisé que no incluyo datos personales ni datos financieros reales. / I checked that I include no personal data and no real financial data.
          required: true
