name: Reportar un error / Report a bug
description: Algo no funciona como esperabas. / Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Este issue es público.** No incluyas datos personales ni financieros reales: nombres, montos, números de cuenta o tarjeta, extractos, recibos, correos ni rutas de tu computador. Nunca te pediremos tu libro ni tus extractos.
        **This issue is public.** Don't include personal or real financial data: names, amounts, account or card numbers, statements, receipts, emails or paths on your computer. We will never ask for your book or statements.
  - type: input
    id: version
    attributes:
      label: Versión de expense me / expense me version
      description: En Acerca de (pie de página). / In About (footer).
      placeholder: "0.3.17"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS y chip / macOS and chip
      placeholder: "macOS 15.2, Apple M2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Qué pasó / What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas / What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo / Steps to reproduce
      placeholder: |
        1. Abrir Mis tarjetas
        2. ...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Capturas (opcional) / Screenshots (optional)
      description: Tapa nombres, montos, documentos, rutas y cualquier dato personal antes de subirlas. / Cover names, amounts, documents, paths and any personal data before uploading.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad / Privacy
      options:
        - label: Revisé que no incluyo datos personales ni datos financieros reales (ni en el texto ni en las capturas). / I checked that I include no personal data and no real financial data (in the text or the screenshots).
          required: true
